| N3.3 | Loop Coder<->Reviewer | Handoff gratis via digest |
| N3.4 | Planner read-only | Plano = tasks + decision, sem novo arquivo |
| N3.5 | Submitter como script | Seguranca: segredo recusado, gate manual no git |
| N3.6 | Orquestrador | Encadeia os estagios |

A pipeline reusa a tese do produto (estado compartilhado via .orbit/) no eixo temporal. O grosso
 da infraestrutura ja existe; o que falta e o orquestrador, o sinal de conclusao e as ferramentas
de git com as restricoes de seguranca.
