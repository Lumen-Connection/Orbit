const newSections=String.raw`## N3.7 -- Pipeline Context Contract e Acceptance Criteria (G)

- Depende de: N3.4
- Arquivos: src/context/store.rs, src/tools/context.rs, src/pipeline/contract.rs (novo)
- Pre-requisito de: N3.6 (o orquestrador nao deve ser construido sobre outputs implicitos)
- Problema: hoje o handoff entre estagios depende do proximo modelo inferir corretamente a
  intencao a partir do digest -- frágil. O Reviewer precisa julgar se o codigo parece bom
  (subjetivo, caro em modelo medio) em vez de verificar se o contrato foi cumprido (objetivo,
  mais barato e mais confiavel).
- Solucao: cada estagio tem um contrato explicito de saida (stage artifacts), armazenado no
  .orbit/ como um registro estruturado (nao string de record_decision):

  Planner OUTPUT: tasks, architectural decision, acceptance criteria, scope, non-goals.
  Coder OUTPUT: files changed, implementation summary, tests executed, test results,
    unresolved issues.
  Reviewer OUTPUT: PASS / FAIL, acceptance criteria status (item a item), findings,
    required fixes, commit message.

  Acceptance Criteria sao definidos pelo Planner e sao imutaveis pelo Coder. O Reviewer
  produz um veredito objetivo checando cada AC:

    PASS
    AC1: ok
    AC2: ok

  ou:

    REJECT
    AC3: falhou -- Migration can overwrite existing records.

  Isto torna o Reviewer adequado a um modelo medio: a tarefa passa de julgar se o codigo parece
  bom para verificar se o contrato foi cumprido. Um novo tool approve_stage(verdict, ac_status)
  escreve o veredito estruturado que o orquestrador le.
- Pronto quando: o Planner emite ACs; o Coder nao pode altera-los; o Reviewer produz veredito
  PASS/FAIL com status por AC; o orquestrador le o veredito estruturado (nao parseia string).

## N3.8 -- Verificacao deterministica antes do Reviewer (M)

- Depende de: N3.2
- Arquivos: src/session/agent_loop.rs, src/tools/shell.rs, src/pipeline/mod.rs (novo)
- Pre-requisito de: N3.6
- Problema: o Principio 4 exige a triade (fmt/clippy/test) como condicao de fim de tarefa,
  mas nao como etapa formal da pipeline. O Reviewer hoje receberia o diff e teria que descobrir
  problemas que o compilador, linter ou testes ja detectam -- desperdico de tokens de um modelo
  medio para trabalho deterministico.
- Solucao: etapa formal entre Coder e Reviewer. O orquestrador, ao terminar o estagio Coder,
  roda determinasticamente via run_command (src/tools/shell.rs, ja existe):

  1. cargo fmt --all --check
  2. cargo clippy --all-targets -- -D warnings
  3. cargo test --all-targets

  O resultado (passou / qual falhou + saida) e anexado aos stage artifacts do Coder. O Reviewer
  recebe DIFF + TASKS + ACCEPTANCE CRITERIA + TEST RESULTS + LINT RESULTS -- nao gasta tokens
  descobrindo o que o toolchain ja detectou. Para projetos nao-Rust, o mesmo principio se aplica
  ao toolchain correspondente (npm test, go vet, etc.), lido das run configs (M1.4).
- Pronto quando: o Coder termina e o orquestrador roda a triade antes de disparar o Reviewer;
  o Reviewer recebe os resultados no contrato; uma falha de clippy e visivel para o Reviewer
  sem ele precisar roda-la.

## N3.9 -- Routing por complexidade (M)

- Depende de: N3.1, N3.7
- Arquivos: src/ui/coder/sessions.rs, src/pipeline/mod.rs (novo)
- Objetivo: nem todo pedido precisa da pipeline completa. "Fix typo" nao deveria passar por
  Planner -> Coder -> Reviewer. O routing adapta o fluxo a complexidade do pedido --
  provavelmente o maior economizador de custo do backlog.
- Solucao (versao manual nesta rodada): no dialogo de configuracao (N3.1), o usuario escolhe a
  complexidade:

  - Trivial (ex.: fix typo, rename variable, add missing import): fluxo Coder direto.
  - Normal (ex.: add search to sessions): fluxo Planner -> Coder -> Verify (N3.8).
  - Complex (ex.: replace storage subsystem): fluxo Planner -> Coder -> Verify -> Reviewer ->
    loop ate 3x -> Git Gate.

  A classificacao automatica (heuristica ou LLM classificador) fica fora desta rodada: heuristica
  por tamanho de prompt e fragil, e um LLM classificador adiciona um turno de modelo antes da
  pipeline, que e exatamente o custo que se quer evitar. A versao manual ja entrega o ganho de
  custo. Automatizar depois, com dados reais de uso.
- Pronto quando: o dialogo oferece os tres fluxos; escolher Trivial dispara so o Coder;
  escolher Complex dispara a pipeline completa com Reviewer e Git Gate.

## N3.10 -- Opcao Auto de modelo por estagio (M)

- Depende de: N3.1
- Arquivos: src/providers/catalog.rs, src/app.rs, src/ui/coder/sessions.rs
- Objetivo: reduzir friccao. Cada combo de estagio (Planner/Coder/Reviewer) tem uma opcao Auto.
  Usuarios que nao querem gerenciar modelos nao precisam escolher.
- Solucao: a politica Auto mapeia classe de papel a classe de modelo:

  Planner  -> strongest reasoning
  Coder    -> best cost/performance coding
  Reviewer -> strong verification

  Exige uma classificacao dos modelos do catalogo que HOJE NAO EXISTE: AiModel
  (src/providers/mod.rs:103) tem prompt_price, completion_price, context_length, supports_tools,
  supports_vision, mas nenhum campo de classe. Implementar Auto exige enriquecer o catalogo com
  essa classificacao (curadoria estatica de MODEL_GROUPS em src/app.rs, ja com descriptors humanos
  que poderiam virar tags, ou campo novo). Nao e um mero toggle de UI -- e trabalho extra nao
  trivial. Endossado como objetivo, com a ressalva de que depende de enriquecer o catalogo.
- Pronto quando: com Auto selecionado, o Orbit escolhe o modelo por estagio segundo a politica;
  usuarios avancados ainda podem escolher manualmente.

`;

const marker='## Resumo da pipeline';
if(s.indexOf(marker)===-1){console.error('marker NOT FOUND');process.exit(1);}
s=s.replace(marker, newSections + marker);
fs.writeFileSync(p,s,'utf8');
console.log('new sections inserted');
console.log('N3.7 present:', s.indexOf('N3.7')!==-1);
console.log('N3.8 present:', s.indexOf('N3.8')!==-1);
console.log('N3.9 present:', s.indexOf('N3.9')!==-1);
console.log('N3.10 present:', s.indexOf('N3.10')!==-1);""",
]
