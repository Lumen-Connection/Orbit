## Principios

1. Escopo aditivo e cirurgico. Nenhuma tarefa reescreve um modulo inteiro. Cada uma
   toca poucos arquivos e deixa a triade verde.
2. Cada tarefa e independente. As dependencias estao declaradas, mas dentro de cada
   faixa a ordem numerica ja e topologicamente valida.
3. Identificadores e comentarios em ingles; este documento em portugues.
4. Cada tarefa termina com cargo fmt --all --check, cargo clippy --all-targets -- -D warnings,
   cargo test --all-targets verdes.
5. Legenda de esforco: P pequeno (< 2h), M medio (meio dia), G grande (1-3 dias).

