# P1 -- Alto ROI em custo, latencia e UX

### N1.1 -- multi_edit tool for batch edits (G)

- Depende de: N0.1
- Arquivos: src/tools/fs.rs, src/tools/mod.rs, src/session/roles.rs
- Problema: edit_file (src/tools/fs.rs:410) faz uma substituicao de snippet unico por
  chamada. Um padrao comum e o agente precisar editar 3 a 5 pontos no mesmo arquivo. Hoje isso e
  5 chamadas de ferramenta, 5 aprovacoes, 5 turnos de modelo -- latencia e custo multiplicados, e
  fadiga de aprovacao.
- Solucao: nova ferramenta multi_edit que aceita um path e um array de pares
  {old_string, new_string}. Aplica todas as substituicoes sequencialmente sobre o mesmo conteudo
  original, produzindo um unico FilePatch (uma aprovacao, um diff). Falha inteira se qualquer
  snippet nao for encontrado ou nao for unico -- transacao atomica, sem meio-termo. ToolRisk::Mutating.
  Adicionar multi_edit as listas de AgentRole::allowed_tools() para Coder e Tester (mesma
  permissao de edit_file); Reviewer e Architect continuam sem.
- Pronto quando: um teste edita 3 pontos num arquivo com uma chamada e um patch resultante;
  um snippet ambiguo falha a operacao inteira sem aplicar nada; o catalogo do Reviewer nao inclui
  multi_edit.

