# N3 -- Pipeline de IA: Sessoes Concorrentes vs Orquestrador

A arquitetura atual do Orbit ja suporta varias sessoes concorrentes sobre o mesmo Project Context
(.orbit/). Cada sessao tem seu proprio modelo, papel, historico e CancellationToken
(SessionManager, src/session/manager.rs; DEFAULT_SESSION_SLOTS = 3). O handoff entre elas e
automatico e gratuito: o digest (build_digest, src/context/digest.rs) injeta no system prompt de
cada turno as decisoes recentes, as tarefas abertas e -- o item critico -- os arquivos alterados por
outras sessoes desde a ultima execucao desta (foreign_changes). Isto realiza a tese do produto:
trocar de modelo nao significa recomecar, significa que o proximo agente ja sabe o que aconteceu.

Esta secao propoe um segundo modo de operacao que reusa essa mesma infraestrutura, mas em
sequencia em vez de concorrencia: a pipeline. A decisao entre os dois modos e do usuario, por
projeto, na UI do Coder Mode.

## Os dois modos

### Modo A -- Sessoes Concorrentes (ja existe)

O usuario abre N sessoes manuais, cada uma com seu papel e modelo, e dirige cada uma livremente.
Elas compartilham o estado via .orbit/; o digest resolve o handoff. Nenhuma automatizacao entre
estagios -- o humano e o orquestrador.

- Vantagem: controle total; o usuario decide quando e se passa o bastao; nada acontece que ele
  nao tenha pedido.
- Desvantagem: carga cognitiva alta com varias sessoes; facil esquecer de pedir ao Reviewer que
  valide o que o Coder fez.
- Custo de implementacao: zero -- e o estado atual.

### Modo B -- Orquestrador (a construir)

O usuario descreve uma feature, atribui um modelo a cada estagio, e o Orbit dispara os estagios em
sequencia, passando o bastao automaticamente entre eles (com gates opcionais). O estado continua
compartilhado via .orbit/; o handoff continua sendo o digest -- so que agora o orquestrador decide
re-disparar o proximo estagio em vez de o humano trocar de aba.

- Vantagem: fluxo ponta-a-ponta com uma unica instrucao; o Reviewer sempre roda depois do Coder;
  o loop Coder<->Reviewer e quase gratuito (ver N3.3).
- Desvantagem: menos controle fino por turno; risco de loop; custo invisivel se gates abertos.
- Custo de implementacao: o orquestrador + sinal de conclusao + ferramentas de git (ver N3.4).

## Decisao de produto: os dois modos coexistem

Nao e um substituto, e uma alternativa. No cabecalho do Coder Mode o usuario escolhe o modo de
operacao do projeto:

- Sessoes Concorrentes (padrao, comportamento atual): o botao Nova Sessao cria sessoes livres;
  nao ha pipeline.
- Orquestrador: o botao vira Nova Pipeline; abre um dialogo de configuracao (N3.1) onde o
  usuario atribui o modelo de cada estagio antes de pedir a feature.

O estado compartilhado (.orbit/) e o mesmo nos dois modos. A diferenca e so quem dispara o
proximo estagio: o humano (modo A) ou o orquestrador (modo B).

## O estagios da pipeline

| Estagio | Papel | Modelo (exemplo) | Risco | Gate para o proximo |
|---|---|---|---|---|
| Planner | Architect | forte (GPT-5.6 Sol) | leitura + contexto | automatico |
| Coder | Coder | pequeno (V4 Flash / Grok 4.6) | escrita | automatico |
| Reviewer | Reviewer | medio (GLM-5.2) | leitura + execucao de testes | manual (default) |
| Submitter | Coder + git tools | n/a (ver N3.5) | execucao (git) | -- |

Os modelos sao escolhidos pelo usuario no dialogo de configuracao (N3.1) antes de cada pipeline.
Nada e hardcoded; o usuario pode reusar o mesmo modelo em todos os estagios se quiser.

## N3.1 -- Dialogo de configuracao da pipeline (M)

- Depende de: N0.1
- Arquivos: src/ui/coder/sessions.rs, src/coder.rs
- Objetivo: o usuario monta a pipeline antes de pedir a feature. Quatro combos de modelo,
  um por estagio, preenchidos a partir do catalogo (MODEL_GROUPS). Defaults sensatos:
  Planner = modelo de raciocinio mais forte do catalogo; Coder = modelo de coding rapido;
  Reviewer = modelo de raciocinio medio; Submitter = n/a (ver N3.5). Um campo de texto para a
  feature. Um toggle Auto por gate (default: auto entre Planner->Coder->Reviewer, manual antes
  do Submitter).
- Pronto quando: o dialogo abre, os combos refletem o catalogo, e ao confirmar o Orbit cria
  as quatro sessoes (uma por estagio) sem dispara-las, esperando o primeiro estagio.

## N3.2 -- Sinal de conclusao de estagio (M)

- Depende de: N3.1
- Arquivos: src/session/agent_loop.rs, src/session/manager.rs, src/coder.rs
- Problema: run_turn (src/session/agent_loop.rs) retorna TurnResult (Completed,
  IterationLimitReached, BudgetExceeded, Cancelled, Failed), mas o spawner em src/coder.rs:~1130
  faz let _ = run_turn(...) -- o resultado e descartado. Nao ha callback de conclusao. O sinal
  natural de estagio pronto ja existe: poll_all_detailed (src/session/manager.rs:195) detecta a
  transicao busy -> false quando recebe AgentEvent::TurnFinished (apply_agent_event retorna
  false). Mas ninguem observa essa transicao para encadear o proximo estagio.
- Solucao: um enum PipelineEvent { StageFinished { stage, result }, ... } emitido quando a
  sessao de um estagio sai de busy. O orquestrador assina esses eventos e decide o proximo passo.
  Reuso da transicao que ja existe -- nao inventar um segundo canal de conclusao. O TurnResult
  precisa chegar ate o orquestrador (hoje descartado), para distinguir Completed de Failed e
  parar a pipeline em caso de falha.
- Pronto quando: um teste dispara um estagio contra um provider simulado que termina com
  FinishReason::Stop e o orquestrador recebe StageFinished { result: Completed }.

## N3.3 -- O loop Coder<->Reviewer e quase gratuito (M)

- Depende de: N3.2
- Arquivos: src/session/agent_loop.rs, src/context/digest.rs
- O achado arquitetural: quando o Reviewer rejeita, ele escreve findings via add_finding
  (src/tools/context.rs:128). Quando o Coder roda de novo, o digest injeta Recent findings
  (src/context/digest.rs:~88) -- o Coder automaticamente ve as criticas do Reviewer sem
  nenhuma mensagem especial. O handoff do loop e o digest, de graça. O orquestrador so precisa
  decidir re-disparar a sessao Coder; o que corrigir ja chegou pelo Project Context.
- Solucao: guarda anti-loop -- no maximo 3 ciclos Coder->Reviewer->Coder. O orquestrador conta
  os ciclos e, ao estourar, para a pipeline com um aviso claro e marca as tasks relevantes. O
  Reviewer precisa de uma forma explicita de dizer aprovado ou rejeitado: um novo tool
  approve_stage() que escreve no .orbit/ um registro estruturado que o orquestrador le
  (nao parsear string de record_decision).
- Pronto quando: o Reviewer rejeita, o Coder re-roda e o digest contem os findings; apos 3
  ciclos a pipeline para com aviso; apos aprovacao do Reviewer a pipeline avanca para o Submitter.

## N3.4 -- O Planner e read-only: o plano vira tasks + decision (P)

- Depende de: N3.1
- Arquivos: src/context/store.rs, src/tools/context.rs
- Problema: AgentRole::Architect (src/session/roles.rs) e read-only + contexto -- nao tem
  write_file. Entao o Planner nao consegue criar um PLAN.md no disco.
- Solucao adotada: o plano e a lista de tarefas (update_task, em tasks.md) mais uma
  record_decision descrevendo a abordagem. Tudo no Project Context, on-thesis, zero novo
  arquivo. O Coder le o plano via digest (tarefas abertas + decisao de abordagem). Se um
  PLAN.md humano-legivel for desejado depois, e um novo papel Planner com write_file escopado a
  .orbit/plan.md -- mas e escopo, e fica fora desta rodada.
- Pronto quando: o Planner, rodando como Architect, produz N tarefas em tasks.md e uma decisao
  de abordagem; o Coder, no turno seguinte, ve ambos no digest.

## N3.5 -- O Submitter e um script, nao o modelo mais barato (G)

- Depende de: N3.2, N0.1
- Arquivos: src/tools/git.rs (novo), src/tools/mod.rs, src/security/policy.rs, src/session/roles.rs
- Decisao central: alocar o modelo menos confiavel na acao mais cara de reverter (commit +
  push) e a inversao de risco. Um modelo minusclo pode cometer .env, forcar push em main,
  escrever mensagem lixo, empurrar para o remote errado.
- Solucao: o Submitter nao e um LLM. A inteligencia (o que commitar, qual mensagem) ja veio do
  Reviewer; a execucao e mecanica. Implementar tres ferramentas com ToolRisk::Executing:
  git_status, git_commit, git_push.
  - git_status: ReadOnly; lista arquivos modificados.
  - git_commit: Executing; aceita uma message (fornecida pelo Reviewer) e um caminho de
    staging explicito. Recusa commitar qualquer arquivo que is_sensitive (src/security/paths.rs:147)
    retorne true (.env, *.pem, *.key, id_rsa, .git/config, *.p12) -- sem opcao de aprovar. Esta e a
    defesa contra vazamento de segredo mais concreta. Sujeito a denylist absoluta
    (src/security/policy.rs: is_absolutely_denied ja cobre o padrao).
  - git_push: Executing; sujeito a aprovacao manual obrigatoria. Forcar push (--force) e
    negado por padrao; so com flag explicita e segundo gate de confirmacao.
- Gates: Reviewer -> Submitter e sempre manual (default). O Reviewer escreve a mensagem do
  commit a partir do diff; o Submitter executa a string pronta. O modelo barato nunca decide o
  que entra no git.
- Sessao do Submitter: usa AgentRole::Coder (precisa de write/exec) com o modelo mais barato,
  OU -- preferivel -- uma sessao sem modelo que so invoca as ferramentas de git diretamente a
  partir do veredito do Reviewer. A segunda opcao elimina o risco do modelo barato.
- Estas ferramentas estao explicitamente fora da v1.0 (PlanejamentoDefinitivo.md S7.3). A pipeline
e o caso de uso que justifica retira-las do backlog e implementa-las, com as restricoes acima.
- Pronto quando: git_status lista os arquivos; git_commit com .env na staging e recusado sem
  opcao de aprovar; git_push exige aprovacao manual; um teste forca um --force e e negado.

## N3.6 -- Orquestrador (M)

- Depende de: N3.2, N3.3, N3.5
- Arquivos: src/pipeline/mod.rs (novo), src/coder.rs, src/session/manager.rs
- Objetivo: o componente que encadeia os estagios. Mantem o estado da pipeline (estagio
  atual, contagem de ciclos, veredito do Reviewer) e reage a PipelineEvent::StageFinished.
- Fluxo: Planner (auto) -> Coder (auto) -> Reviewer (auto) -> [loop ate 3x: Coder -> Reviewer] ->
  Submitter (gate manual). Cada transicao monta um novo TurnDeps com o modelo e papel do
  proximo estagio e chama run_turn via rt.spawn. O sinal de conclusao (N3.2) dispara a proxima.
- Cancelamento: um CancellationToken da pipeline cancela todos os estagios; resolver
  aprovacoes pendentes como Denied (mesmo padrao de cancel_coder_turn, src/coder.rs:1289).
- UI: o transcript da pipeline mostra os estagios como blocos sequenciais (Planner: ..., Coder: ...,
  Reviewer: aprovado/rejeitado, Submitter: pendente aprovacao). O usuario ve o fluxo inteiro numa
  unica conversa, nao em quatro abas separadas.
- Pronto quando: uma pipeline contra providers simulados percorre Planner -> Coder -> Reviewer
  -> Submitter sem intervencao (gates auto ate o Submitter); o Reviewer rejeita uma vez e o Coder
  re-roda; o Submitter espera gate manual; cancelar a pipeline para tudo limpo.

