# P0 -- Seguranca e armadilhas latentes

Itens que nao quebram a triade hoje, mas representam risco real de seguranca ou de regressao
silenciosa. Devem ser tratados antes de qualquer nova feature que dependa desses caminhos.

### N0.1 -- Enforcement de papel no momento do dispatch (M)

- Depende de: --
- Arquivos: src/session/agent_loop.rs, src/tools/mod.rs, src/session/roles.rs
- Problema: a fronteira de papel e somente no nivel do catalogo. ToolRegistry::for_role
  (src/tools/mod.rs:388) filtra schemas() enviado ao modelo, mas dispatch_tool
  (src/session/agent_loop.rs:255) resolve via deps.registry.get(&call.name) sem nenhuma
  checagem de papel. Um Reviewer cujo turno somehow dispatchasse write_file executaria a escrita.
  Isto ja esta anotado em finding, mas e o item de seguranca mais concreto do backlog.
- Solucao: adicionar AgentRole::allowed_tools() como guarda em dispatch_tool, antes da
  execucao. Recusar com ToolError::Message se a ferramenta nao estiver na lista do papel, e devolver
  um ToolResult de erro claro ao modelo. Teste: uma TurnDeps com session_role: Reviewer e um
  registry completo (workspace_tools()) -- uma chamada write_file e recusada no dispatch, nao
  apenas omitida do catalogo.
- Pronto quando: um teste prova que a recusa acontece no dispatch independentemente do registry;
  o Reviewer continua recebendo o catalogo de 12; Coder e Tester continuam com 14.

### N0.2 -- Remover a armadilha do state.coder.registry (P)

- Depende de: --
- Arquivos: src/coder.rs
- Problema: reset_agent_session (src/coder.rs:1643) reatribui
  state.coder.registry = Arc::new(ToolRegistry::workspace_tools()) (as 14 ferramentas) a cada
  abertura de projeto. Esse campo nunca e usado para dispatch -- ambos os construtores de
  TurnDeps (src/coder.rs:933 e src/coder.rs:1224) constroem um registry novo via
  ToolRegistry::for_role(session_role). O campo e peso morto e armadilha: qualquer codigo futuro
  que leia state.coder.registry diretamente bypassa a fronteira de papel.
- Solucao: remover o campo registry de CoderState e a linha em reset_agent_session.
  Confirmar com grep que nenhuma leitura resta. Se houver receio de remover, no minimo marcar
  como deprecated e adicionar um comentario de que nunca deve ser usado para execucao, pois
  TurnDeps constroi um registry por papel a cada turno.
- Pronto quando: cargo test verde; grep por coder.registry em src/ retorna vazio ou
  apenas o comentario de advertencia.

### N0.3 -- Feedback ao trocar papel durante turno ativo (P)

- Depende de: N0.1
- Arquivos: src/coder.rs, src/ui/coder/sessions.rs
- Problema: set_coder_role (src/coder.rs:1570) faz if live.busy { return; } -- troca de
  papel e ignorada silenciosamente durante um turno. O combo box parece aceitar a escolha,
  mas ela so vale no proximo turno. Defensavel (evita inconsistencia mid-turn), mas sem feedback.
- Solucao: quando live.busy, nao aplicar mas desabilitar o combo box de papel durante
  busy com on_disabled_hover_text explicando que a troca vale no proximo turno. Mais honesto
  que aceitar e ignorar.
- Pronto quando: durante um turno, o combo de papel esta desabilitado com hover explicativo;
  ao terminar o turno, o combo volta habilitado e a troca aplica imediatamente.

### N0.4 -- Populate cached_tokens to surface cache savings (M)

- Depende de: --
- Arquivos: src/providers/openrouter.rs, src/providers/mod.rs, src/ui/widgets/cost_meter.rs
- Problema: TokenUsage.cached_tokens (src/providers/mod.rs:36) existe e e 0 por default.
  No parser de stream (src/providers/openrouter.rs, StreamUsage e o mapeamento que monta
  TokenUsage com cached_tokens: 0), o campo de cache do OpenRouter nao e desserializado --
  e hardcoded 0. O OpenRouter devolve cached_tokens para modelos que suportam prompt caching.
  Hoje pagamos tokens cheios em todo turno sem saber quantos foram cached.
- Solucao: adicionar cached_tokens: Option<u32> ao StreamUsage; propagar para
  TokenUsage.cached_tokens; exibir no medidor de custo (cached: N) para que o usuario veja a
  economia. Nao altera o calculo de custo -- apenas torna visivel o que ja acontece se o
  provider aplicar cache.
- Pronto quando: um stream gravado com cached_tokens no bloco usage popula o campo;
  estimate_cost continua correto; o medidor mostra cached: N quando aplicavel.

### N0.5 -- Explicit prompt caching via cache marker (M)

- Depende de: N0.4
- Arquivos: src/providers/openrouter.rs, src/session/agent_loop.rs
- Problema: o system prompt (instrucoes + digest do Project Context) e reenviado em todo
  turno e e grande -- frequentemente 1 a 4k tokens. Para modelos que suportam prompt caching
  (Anthropic via OpenRouter, e a marca cache_control), isso e desperdicio de custo. Hoje nao
  ha nenhuma marca de cache.
- Solucao: o OpenRouter aceita cache_control em mensagens system. Marcar o bloco do
  system prompt como cacheavel. Como o digest muda a cada turno (decisoes recentes, mudancas
  de outras sessoes), cachear o prefixo estavel (CODER_SYSTEM_PROMPT + role.prompt_fragment())
  e deixar o digest fora do cache. Estruturar o system como array de partes com
  cache_control do tipo ephemeral na parte estavel.
- Cuidado: a forma exata da API do OpenRouter muda -- validar contra a documentacao atual
  antes de implementar, e trazer um teste com wiremock que confirma que a marca e enviada.
- Pronto quando: com um modelo que suporta cache, os turnos subsequentes mostram
  cached_tokens > 0 no uso; o custo cai; o prefixo estavel e identico entre turnos (teste).
