### N1.5 -- Preserve stdout/stderr order in run_command (M)

- Depende de: --
- Arquivos: src/tools/shell.rs
- Problema: pump_reader para stdout e stderr rodam como tasks separadas
  (src/tools/shell.rs:130) escrevendo num sink compartilhado sem ordem garantida. Erros de
  build (stderr) podem aparecer antes ou depois das linhas de stdout relacionadas. Para diagnosticar
  falhas, a ordem real importa.
- Solucao: intercalar com timestamp de leitura. Cada chunk carrega um Instant; ordenar por
  timestamp ao montar o relatorio final. Alternativa mais simples: ler stdout e stderr num unico
