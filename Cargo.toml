[package]
name = "orbit"
version = "1.0.0"
edition = "2024"
# `src/bin/orbit-mcp-stub.rs` is a test fixture the MCP e2e tests spawn, so it is
# a real binary target. Name the app explicitly or bare `cargo run` is ambiguous.
default-run = "orbit"

[dependencies]
eframe = { version = "0.36.1", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.36.1"
egui_commonmark = "0.25"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "6"
ignore = "0.4.33"
similar = "3.1.2"
syntect = { version = "5.3.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "regex-onig",
] }
sha2 = "0.10"
rfd = "0.15"
regex = "1"
globset = "0.4"
toml = "0.8"
rusqlite = { version = "0.40.2", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
command-group = { version = "5.0.1", features = ["with-tokio"] }
strip-ansi-escapes = "0.2.1"
anstyle-parse = "1.0.0"
arboard = "3.6.1"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
landlock = "0.4"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
